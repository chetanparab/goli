name: Site check

# Checks site/ (the project homepage) on every change. It never deploys and
# needs no secrets: the homepage is published by the maintainer from their own
# machine, so no Cloudflare credentials live in this public repository.
on:
  push:
    branches: [main]
    paths: ["site/**", "tools/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "tools/**", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Version-stamp CSS/JS (as a deploy would)
        run: tools/stamp-site.sh
      - name: Check the site (local links, no inline code)
        run: node tools/check-site.mjs site
