name: Deploy site

# Publishes site/ to Cloudflare Pages (project "goli"),
# served at https://goli.theanalogyarchitect.com.
on:
  push:
    branches: [main]
    paths: ["site/**", "tools/deploy/**", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Until the Cloudflare secrets are added, the job still checks the site and
      # says so instead of failing: red should mean "broken", not "not set up yet".
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check the site (local links, no inline code)
        run: node tools/check-site.mjs site
      # Wrangler and every dependency are pinned by a lockfile with integrity hashes,
      # because this is the step that holds the Cloudflare token.
      - name: Install Wrangler from the lockfile
        run: npm ci --prefix tools/deploy --no-audit --no-fund
      - name: Deploy site/ to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: tools/deploy/node_modules/.bin/wrangler pages deploy site --project-name goli --branch main --commit-dirty=true
      - name: No Cloudflare credentials yet
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN (Pages → Edit only) and CLOUDFLARE_ACCOUNT_ID as Actions secrets to publish."
