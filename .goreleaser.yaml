version: 2
project_name: goli
builds:
  - main: ./cmd/goli
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - formats: [tar.gz]
    # Stable names, so https://github.com/chetanparab/goli/releases/latest/download/goli_darwin_arm64.tar.gz
    # always points at the newest release.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, THIRD_PARTY_NOTICES.md, README.md, integrations/**/*]
checksum:
  name_template: checksums.txt
changelog:
  use: github
# Package managers. Each needs HOMEBREW_TAP_TOKEN: a fine-grained GitHub token
# with Contents: read/write on the two small repos below (and nothing else),
# saved as an Actions secret in this repo (release.yml always passes it, so
# the variable exists even when empty, and an empty one just skips this).
homebrew_casks:
  - name: goli
    repository:
      owner: chetanparab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"
    directory: Casks
    homepage: https://goli.theanalogyarchitect.com
    description: "Personal go/ links: give any page a short name, type go/name anywhere"
    license: MIT
    binaries: [goli]
    caveats: |
      Point go/ at this computer, then start goli at login:
        goli hosts
        goli install
    # The binaries aren't notarized yet, so lift Gatekeeper's quarantine flag
    # (the standard snippet from goreleaser's docs).
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/goli"]
          end
scoops:
  - repository:
      owner: chetanparab
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: "{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}"
    directory: bucket
    homepage: https://goli.theanalogyarchitect.com
    description: "Personal go/ links: give any page a short name, type go/name anywhere"
    license: MIT
