version: 2
project_name: goli
builds:
  - main: ./cmd/goli
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - formats: [tar.gz]
    # Stable names, so https://github.com/chetanparab/goli/releases/latest/download/goli_darwin_arm64.tar.gz
    # always points at the newest release.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, THIRD_PARTY_NOTICES.md, README.md, integrations/**/*]
checksum:
  name_template: checksums.txt
changelog:
  use: github
# When the repo goes public, uncomment to publish `brew install chetanparab/tap/goli`:
# brews:
